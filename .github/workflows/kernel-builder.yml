name: Build Realme C51 Kernel (Unisoc T612)

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "Kernel source repository URL"
        required: true
        default: "https://github.com/YOUR_USER/YOUR_KERNEL_REPO"
      kernel_branch:
        description: "Kernel source branch"
        required: true
        default: "main"

env:
  ARCH: arm64
  SUBARCH: arm64
  HEADER_ARCH: arm64
  DEFCONFIG: sprd_sharkl5Pro_defconfig
  CROSS_COMPILE: aarch64-linux-gnu-
  CROSS_COMPILE_ARM32: arm-linux-gnueabi-
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabi \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libelf-dev \
            zlib1g-dev \
            ccache \
            zip \
            glibc-source \
            clang \
            lld \
            llvm

      - name: Verify toolchains
        run: |
          which aarch64-linux-gnu-gcc
          aarch64-linux-gnu-gcc --version
          which arm-linux-gnueabi-gcc
          arm-linux-gnueabi-gcc --version

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Clone kernel source
        run: |
          git clone --depth=1 -b "${{ github.event.inputs.kernel_branch }}" \
            "${{ github.event.inputs.kernel_repo }}" kernel

      - name: Configure ccache
        run: |
          ccache --max-size=5G
          ccache --zero-stats

      - name: Generate defconfig
        working-directory: kernel
        run: |
          make O=out ARCH=${ARCH} SUBARCH=${SUBARCH} \
            CROSS_COMPILE=${CROSS_COMPILE} \
            CROSS_COMPILE_ARM32=${CROSS_COMPILE_ARM32} \
            CC="ccache aarch64-linux-gnu-gcc" \
            ${DEFCONFIG}

      - name: Build kernel
        working-directory: kernel
        run: |
          make -j$(nproc --all) O=out \
            ARCH=${ARCH} SUBARCH=${SUBARCH} HEADER_ARCH=${HEADER_ARCH} \
            CROSS_COMPILE=${CROSS_COMPILE} \
            CROSS_COMPILE_ARM32=${CROSS_COMPILE_ARM32} \
            CC="ccache aarch64-linux-gnu-gcc" \
            Image.gz-dtb 2>&1 | tee build.log

      - name: Show ccache stats
        if: always()
        run: ccache --show-stats

      - name: Verify output
        working-directory: kernel
        run: |
          ls -lh out/arch/arm64/boot/
          test -f out/arch/arm64/boot/Image.gz-dtb

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: Image.gz-dtb
          path: kernel/out/arch/arm64/boot/Image.gz-dtb
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: kernel/build.log
          if-no-files-found: ignore
