name: Build Realme C51 Kernel (Unisoc T612)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

env:
  ARCH: arm64
  SUBARCH: arm64
  HEADER_ARCH: arm64
  CCACHE_DIR: ${{ github.workspace }}/.ccache

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: kernel
          fetch-depth: 1

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabi \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libelf-dev \
            zlib1g-dev \
            ccache \
            zip \
            glibc-source \
            clang \
            lld \
            llvm \
            python3 \
            cpio

      - name: Verify toolchains
        run: |
          aarch64-linux-gnu-gcc --version
          arm-linux-gnueabi-gcc --version

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Configure ccache
        run: |
          ccache --max-size=5G
          ccache --zero-stats
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"

      - name: Remove hybridswap from zram build
        working-directory: kernel
        run: |
          echo "===== zram Makefile (before) ====="
          cat drivers/block/zram/Makefile
          echo "===== hybridswap mentions ====="
          grep -rn -i "hybridswap" drivers/block/zram/Makefile drivers/block/zram/Kconfig || true

          sed -i '/hybridswap/I s/^/# disabled: /' drivers/block/zram/Makefile

          echo "===== zram Makefile (after) ====="
          cat drivers/block/zram/Makefile

      - name: Generate defconfig
        working-directory: kernel
        run: |
          make O=out ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            HOSTCFLAGS="-fcommon -Wno-error" \
            sprd_sharkl5Pro_defconfig

      - name: Build kernel
        working-directory: kernel
        run: |
          ARGS=(
            O=out
            ARCH=arm64
            SUBARCH=arm64
            HEADER_ARCH=arm64
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            HOSTCFLAGS="-fcommon -Wno-error"
            KCFLAGS="-Wno-error -Wno-unused-but-set-variable -Wno-misleading-indentation -fcommon"
          )

          set +e
          make -j"$(nproc --all)" "${ARGS[@]}" 2>&1 | tee build.log
          STATUS=${PIPESTATUS[0]}

          if [ "$STATUS" -ne 0 ]; then
            echo "=============================================="
            echo "Parallel build failed. Re-running with -j1 to"
            echo "show the real error at the end of the log."
            echo "=============================================="
            make -j1 "${ARGS[@]}" 2>&1 | tee -a build.log
            STATUS=${PIPESTATUS[0]}
          fi

          exit "$STATUS"

      - name: Show real errors (if build failed)
        if: failure()
        working-directory: kernel
        run: |
          echo "===== Lines containing errors ====="
          grep -nE "error:|fatal error|undefined reference|No such file|\*\*\* \[" build.log | head -n 30 || true
          echo "===== Last 60 lines ====="
          tail -n 60 build.log || true

      - name: Show ccache stats
        if: always()
        run: ccache --show-stats

      - name: Verify output
        working-directory: kernel
        run: |
          ls -lh out/arch/arm64/boot/
          test -f out/arch/arm64/boot/Image.gz-dtb

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: Image.gz-dtb
          path: kernel/out/arch/arm64/boot/Image.gz-dtb
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: kernel/build.log
          if-no-files-found: ignore
