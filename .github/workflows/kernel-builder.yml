name: Build Realme C51 Kernel (Unisoc T612)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

env:
  ARCH: arm64
  SUBARCH: arm64
  HEADER_ARCH: arm64
  DEFCONFIG: sprd_sharkl5Pro_defconfig
  CROSS_COMPILE: aarch64-linux-gnu-
  CROSS_COMPILE_ARM32: arm-linux-gnueabi-
  CCACHE_DIR: ${{ github.workspace }}/.ccache

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: kernel
          fetch-depth: 1

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabi \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libelf-dev \
            zlib1g-dev \
            ccache \
            zip \
            glibc-source \
            clang \
            lld \
            llvm

      - name: Verify toolchains
        run: |
          which aarch64-linux-gnu-gcc
          aarch64-linux-gnu-gcc --version
          which arm-linux-gnueabi-gcc
          arm-linux-gnueabi-gcc --version

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Configure ccache
        run: |
          ccache --max-size=5G
          ccache --zero-stats
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"

      - name: Generate defconfig
        working-directory: kernel
        run: |
          make O=out ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            HOSTCFLAGS="-fcommon" \
            sprd_sharkl5Pro_defconfig

      - name: Build kernel
        working-directory: kernel
        run: |
          set -o pipefail
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            HEADER_ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            HOSTCFLAGS="-fcommon" \
            KCFLAGS="-Wno-error -fcommon" \
            2>&1 | tee build.log

      - name: Show last errors (if build failed)
        if: failure()
        working-directory: kernel
        run: |
          echo "===== Error lines ====="
          grep -nE "error:|Error [0-9]+|\*\*\*" build.log | tail -n 40 || true
          echo "===== Last 40 lines ====="
          tail -n 40 build.log || true

      - name: Show ccache stats
        if: always()
        run: ccache --show-stats

      - name: Verify output
        working-directory: kernel
        run: |
          ls -lh out/arch/arm64/boot/
          test -f out/arch/arm64/boot/Image.gz-dtb

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: Image.gz-dtb
          path: kernel/out/arch/arm64/boot/Image.gz-dtb
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: kernel/build.log
          if-no-files-found: ignore
