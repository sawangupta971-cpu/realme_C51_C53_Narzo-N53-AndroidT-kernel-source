name: Build Realme C51 Kernel (Unisoc T612)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

env:
  ARCH: arm64
  SUBARCH: arm64
  HEADER_ARCH: arm64
  CCACHE_DIR: ${{ github.workspace }}/.ccache

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: kernel
          fetch-depth: 1

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabi \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libelf-dev \
            zlib1g-dev \
            ccache \
            zip \
            glibc-source \
            clang \
            lld \
            llvm \
            python3 \
            cpio

      - name: Verify toolchains
        run: |
          aarch64-linux-gnu-gcc --version
          arm-linux-gnueabi-gcc --version

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Configure ccache
        run: |
          ccache --max-size=5G
          ccache --zero-stats
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"

      - name: Remove hybridswap from zram build
        working-directory: kernel
        run: |
          sed -i '/hybridswap/I s/^/# disabled: /' drivers/block/zram/Makefile

      - name: Remove -Werror from all kernel Makefiles
        working-directory: kernel
        run: |
          find . \( -name 'Makefile*' -o -name 'Kbuild' -o -name '*.mk' \) -type f \
            -exec sed -i -E 's/-Werror(=[A-Za-z0-9_+-]+)?( |$)/\2/g' {} +

      - name: Check oplus folder and fix battery driver
        working-directory: kernel
        run: |
          echo "===== oplus_gauge.h anywhere in repo ====="
          find . -name "oplus_gauge.h" | head -n 5 || true
          echo "===== sc27xx_fuel_gauge files in repo ====="
          find . -name "sc27xx_fuel_gauge*" | head -n 5 || true

          if [ ! -f drivers/power/oplus/v1/oplus_gauge.h ]; then
            echo ">>> oplus_gauge.h missing, disabling unisoc_battery in Makefile"
            sed -i '/unisoc_battery/ s/^/# disabled: /' drivers/power/supply/Makefile
          fi

      - name: Generate defconfig
        working-directory: kernel
        run: |
          make O=out ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            HOSTCFLAGS="-fcommon -Wno-error" \
            sprd_sharkl5Pro_defconfig

      - name: Build kernel
        working-directory: kernel
        run: |
          ARGS=(
            O=out
            ARCH=arm64
            SUBARCH=arm64
            HEADER_ARCH=arm64
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            HOSTCFLAGS="-fcommon -Wno-error"
            KCFLAGS="-Wno-error -Wno-strict-prototypes -Wno-unused-but-set-variable -Wno-misleading-indentation -fcommon"
          )

          : > build.log
          STATUS=1

          for ROUND in 1 2 3 4 5 6; do
            echo "=============== BUILD ROUND $ROUND ===============" | tee -a build.log
            set +e
            make -j"$(nproc --all)" -k "${ARGS[@]}" 2>&1 | tee round.log
            STATUS=${PIPESTATUS[0]}
            set -e
            cat round.log >> build.log

            if [ "$STATUS" -eq 0 ]; then
              echo "BUILD SUCCESS"
              break
            fi

            grep -oE "No rule to make target '[^']+\.o'" round.log \
              | sed -E "s/.*'([^']+)'/\1/" | sort -u > missing.txt || true

            if [ ! -s missing.txt ]; then
              echo "No missing-source errors found. Stopping retries."
              break
            fi

            echo "===== Missing source files, removing from Makefiles ====="
            while read -r OBJ; do
              DIR=$(dirname "$OBJ")
              BASE=$(basename "$OBJ")
              NAME="${BASE%.o}"
              if [ ! -f "$DIR/$NAME.c" ] && [ ! -f "$DIR/$NAME.S" ]; then
                ESC=$(printf '%s' "$BASE" | sed 's/\./\\./g')
                echo "removing $BASE from $DIR"
                for MK in "$DIR/Makefile" "$DIR/Kbuild"; do
                  if [ -f "$MK" ]; then
                    sed -i -E "s/(^|[[:space:]])${ESC}([[:space:]]|\$)/\1\2/g" "$MK"
                  fi
                done
              fi
            done < missing.txt
          done

          if [ "$STATUS" -ne 0 ]; then
            echo "=============================================="
            echo "Build failed. Error summary:"
            echo "=============================================="
            grep -nE "error:|fatal error|undefined reference|No such file|No rule to make target" round.log | sort -u | head -n 40
          fi

          exit "$STATUS"

      - name: Show real errors (if build failed)
        if: failure()
        working-directory: kernel
        run: |
          echo "===== All error lines ====="
          grep -nE "error:|fatal error|undefined reference|No such file|No rule to make target|\*\*\* \[" build.log | sort -u | tail -n 40 || true

      - name: Show ccache stats
        if: always()
        run: ccache --show-stats

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.run_id }}

      - name: Verify output
        working-directory: kernel
        run: |
          ls -lh out/arch/arm64/boot/
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "Image.gz-dtb found"
          elif [ -f out/arch/arm64/boot/Image.gz ] || [ -f out/arch/arm64/boot/Image ]; then
            echo "WARNING: Image.gz-dtb not built, but Image / Image.gz exists"
          else
            echo "No kernel image found"
            exit 1
          fi

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: |
            kernel/out/arch/arm64/boot/Image.gz-dtb
            kernel/out/arch/arm64/boot/Image.gz
            kernel/out/arch/arm64/boot/Image
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: kernel/build.log
          if-no-files-found: ignore
